crons:
  - name: morning-celebrations
    description: "Sends the 8am IST phone notification about today's birthdays and anniversaries"
    cron: "0 8 * * *"
    timezone: "Asia/Kolkata"
    endpoint: "{{BASE_URL}}/api/cron/celebrations"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: checkout-reminders
    description: "Every 15 min, reminds on-duty staff on their phone once their shift has ended"
    cron: "*/15 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/checkout-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
