crons:
  - name: morning-celebrations
    description: "Sends the 8am IST phone notification about today's birthdays and anniversaries"
    cron: "0 8 * * *"
    timezone: "Asia/Kolkata"
    endpoint: "{{BASE_URL}}/api/cron/celebrations"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: checkout-reminders
    description: "Every 15 min, reminds on-duty staff on their phone once their shift has ended"
    cron: "*/15 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/checkout-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: missed-checkout-digest
    description: "8am IST phone summary to admins and sub-admins of who missed check-out yesterday"
    cron: "0 8 * * *"
    timezone: "Asia/Kolkata"
    endpoint: "{{BASE_URL}}/api/cron/missed-checkout-digest"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: selfie-purge
    description: "Daily 3am IST: clears check-in/out selfies taken before the retention window (the current Asia/Kolkata month plus SELFIE_RETENTION_MONTHS previous months, default 1). Enrolment photos and avatars are kept."
    cron: "0 3 * * *"
    timezone: "Asia/Kolkata"
    endpoint: "{{BASE_URL}}/api/cron/selfie-purge"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
