        <style>
            #kelasa-splash { position: fixed; inset: 0; z-index: 99999; display: none; flex-direction: column; align-items: center; justify-content: center; background: #fff; color: #111; transition: opacity 350ms ease; }
            html.kelasa-app #kelasa-splash { display: flex; }
            #kelasa-splash.hide { opacity: 0; pointer-events: none; }
            #kelasa-splash .logo { width: 42vmin; max-width: 220px; height: auto; }
            #kelasa-splash .name { font-family: 'Hubballi', sans-serif; font-size: clamp(36px, 11vmin, 64px); line-height: 1.2; margin-top: 4vmin; }
            #kelasa-splash .by { position: absolute; bottom: calc(7vh + env(safe-area-inset-bottom)); text-align: center; font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.6; }
            #kelasa-splash .by span { display: block; color: #78787f; }
        </style>
        <script>
            (function () {
                var standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
                if (standalone) document.documentElement.classList.add("kelasa-app");
                window.__kelasaSplashStart = Date.now();
                window.hideKelasaSplash = function () {
                    var el = document.getElementById("kelasa-splash");
                    if (!el) return;
                    var wait = Math.max(0, 900 - (Date.now() - window.__kelasaSplashStart));
                    setTimeout(function () {
                        el.classList.add("hide");
                        setTimeout(function () { el.remove(); }, 400);
                    }, wait);
                };
            })();
        </script>
